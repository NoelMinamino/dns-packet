name: Publish

# Publishes to npm when a version tag (v7.0.1, …) is pushed.
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored here. One-time setup:
#   npm trust github @noelminamino/dns-packet --repo NoelMinamino/dns-packet --file publish.yml --allow-publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify that this workflow is the trusted publisher

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
    # trusted publishing needs a recent npm
    - run: npm install -g npm@11
    - name: Check that the tag matches package.json
      run: |
        version="v$(node -p "require('./package.json').version")"
        if [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
          exit 1
        fi
    - run: npm i
    # prepublishOnly runs lint, type checks and tests; prepare builds the CommonJS files.
    # Prerelease versions (7.1.0-rc.0, …) go to the "next" dist-tag so that "latest" is not moved.
    - name: Publish
      run: |
        version="$(node -p "require('./package.json').version")"
        case "$version" in
          *-*) npm publish --tag next ;;
          *) npm publish ;;
        esac
