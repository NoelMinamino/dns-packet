name: Tests

on: [push, pull_request]

jobs:
  test_cjs:
    runs-on: ubuntu-latest
    needs: test_mjs
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
    - run: npm i
    - run: node test.js

  test_mjs:
    runs-on: ${{ matrix.os }}
    needs: strict
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
    - run: npm i
    - run: npm run unit

  strict:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - run: npm i
    - run: npm run lint
    - run: npm run coverage
